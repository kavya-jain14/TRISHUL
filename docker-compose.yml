services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: trishul
      POSTGRES_USER: trishul
      POSTGRES_PASSWORD: trishul
    ports:
      - '5432:5432'
    volumes:
      - trishul_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U trishul -d trishul']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  trishul_postgres:
